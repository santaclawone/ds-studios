const scoreColor = s => s >= 75 ? '#7cf07c' : s >= 55 ? '#f0c040' : s >= 1 ? '#f07c7c' : '#6e7681';

function buildHunterCard(data) {
  let h = `<div class="card-scroll">
    <div class="loc-badge">${data.location.toUpperCase()}</div>
    <div class="biz-name">${data.business}</div>`;

  if (data.url) {
    const displayUrl = data.url.replace(/^https?:\/\//, '');
    h += `<div class="biz-url"><a href="${data.url}" target="_blank" rel="noopener">${displayUrl}</a></div>`;
  } else {
    h += `<div class="no-web-badge">◈ No Website</div>`;
  }

  h += `<div class="biz-type">${data.type}</div>`;

  if (data.score > 0) {
    const c = scoreColor(data.score);
    const r = 38, circ = 2 * Math.PI * r;
    const off = circ * (1 - data.score / 100);
    h += `<div class="score-row">
      <div class="score-ring">
        <svg width="60" height="60" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="${r}" fill="none" stroke="#21262d" stroke-width="6"/>
          <circle cx="50" cy="50" r="${r}" fill="none" stroke="${c}" stroke-width="6"
            stroke-dasharray="${circ}" stroke-dashoffset="${off}" stroke-linecap="round"/>
        </svg>
        <div class="val" style="color:${c}">${data.score}</div>
        <div class="lbl">Score</div>
      </div>
      <div class="sev-grid">
        <div class="sev-item sev-tech"><span class="n">${data.tech.length}</span><span class="l">Tech Issues</span></div>
        <div class="sev-item sev-visual"><span class="n">${data.visual.length}</span><span class="l">Visual Issues</span></div>
      </div>
    </div>`;
  } else {
    h += `<div class="score-row">
      <div style="flex:1;text-align:center;padding:8px 0">
        <div style="font-size:28px;font-weight:800;color:#6e7681">—</div>
        <div style="font-size:10px;color:#6e7681;text-transform:uppercase;letter-spacing:.5px">No website to score</div>
      </div>
    </div>`;
  }

  // Design quality
  h += `<div class="section-title">Design Quality</div>
    <div class="design-note"><strong>Review</strong><br>${data.design}</div>`;

  // Tech issues
  h += `<div class="section-title">Technical Issues (${data.tech.length})</div>`;
  if (data.tech.length && data.tech[0] !== 'N/A') {
    h += `<div class="issue-card"><div class="card-label"><span class="tag tag-tech">● Tech</span> Issues</div><ul>`;
    data.tech.forEach(t => { h += `<li>${t}</li>`; });
    h += `</ul></div>`;
  } else {
    h += `<div class="issue-card" style="color:#6e7681;font-size:11px;text-align:center;padding:14px">N/A — no website</div>`;
  }

  // Visual issues
  h += `<div class="section-title">Visual Issues (${data.visual.length})</div>`;
  if (data.visual.length && data.visual[0] !== 'N/A') {
    h += `<div class="issue-card"><div class="card-label"><span class="tag tag-visual">● Visual</span> Issues</div><ul>`;
    data.visual.forEach(v => { h += `<li>${v}</li>`; });
    h += `</ul></div>`;
  } else {
    h += `<div class="issue-card" style="color:#6e7681;font-size:11px;text-align:center;padding:14px">N/A — no website</div>`;
  }

  // Business issues
  h += `<div class="section-title">Business Issues (${data.bizGaps.length})</div>`;
  h += `<div class="issue-card"><div class="card-label"><span class="tag tag-biz">● Business</span> Gaps</div><ul>`;
  data.bizGaps.forEach(b => { h += `<li>${b}</li>`; });
  h += `</ul></div>`;

  // Notes
  h += `<div class="notes-box"><strong>🐾 Hunter's Note</strong><br>${data.notes}</div>`;

  h += `<div style="height:4px"></div></div>`;
  return h;
}

function generateEmail(d) {
  const name = d.business;
  const loc = d.location;
  const score = d.score;

  if (score === 0) {
    const subject = encodeURIComponent(name + ' \u2014 Noticed you don\'t have a website yet');
    const body = encodeURIComponent(
      'Hi there,\n\n' +
      'I was looking at businesses in ' + loc + ' and noticed ' + name + ' doesn\'t have a website yet. In 2026, that means you\'re invisible to most of your potential customers \u2014 especially visitors and new residents who search online first.\n\n' +
      'We\'re taking on 5 new clients this month at DS Studios, and I think you\'d be a great fit. We build simple, beautiful websites that actually work for local businesses \u2014 not over-engineered nonsense.\n\n' +
      'Would you be open to a quick chat about what a website could do for ' + name + '?\n\n' +
      'Best,\nDavid Scully\nDS Studios\nhttps://dsstudios.ie'
    );
    return { subject: decodeURIComponent(subject), body: decodeURIComponent(body) };
  }

  // Has website
  var issues = [];
  if (d.tech.length) issues.push('Technical: ' + d.tech.join(', '));
  if (d.visual.length) issues.push('Visual: ' + d.visual.slice(0, 2).join(', '));
  if (d.bizGaps.length) issues.push('Business: ' + d.bizGaps.slice(0, 2).join(', '));
  var issueSummary = issues.slice(0, 2).join(' | ');
  var site = d.url ? d.url.replace(/^https?:\/\//, '') : 'their site';

  var subject = encodeURIComponent(name + ' \u2014 Quick site audit, score ' + score + '/100');
  var body = encodeURIComponent(
    'Hi there,\n\n' +
    'I was taking a look at ' + site + ' recently and ran a quick audit. It scored ' + score + '/100. Here are a few things I noticed:\n\n' +
    issueSummary + '\n\n' +
    'We\'re taking on 5 new clients this month at DS Studios and offering free consultations to local businesses. Happy to walk through what I found and show you what a top-scoring site looks like.\n\n' +
    'Worth 10 minutes?\n\n' +
    'Best,\nDavid Scully\nDS Studios\nhttps://dsstudios.ie'
  );
  return { subject: decodeURIComponent(subject), body: decodeURIComponent(body) };
}

// ===== INIT =====
(function(){
  const all = HUNTER_DATA;
  const total = all.length;
  const track = document.getElementById('track'),
        dotsEl = document.getElementById('dots'),
        ctr = document.getElementById('ctr'),
        prevBtn = document.getElementById('prevBtn'),
        nextBtn = document.getElementById('nextBtn'),
        swipeWrap = document.getElementById('swipeWrap');

  // Create card slots
  all.forEach(() => {
    const div = document.createElement('div');
    div.className = 'card loading-card';
    div.innerHTML = '<span>Loading…</span>';
    track.appendChild(div);
  });
  dotsEl.innerHTML = all.map((_, i) => `<div class="dot${i===0?' active':''}" data-i="${i}"></div>`).join('');

  let cur = 0;

  function render(idx) {
    const el = track.querySelectorAll('.card')[idx];
    if (!el) return;
    el.className = 'card';
    el.innerHTML = buildHunterCard(all[idx]);
  }

  function update() {
    track.style.transform = `translateX(-${cur * 100}%)`;
    ctr.textContent = `${cur + 1}/${total}`;
    prevBtn.disabled = cur === 0;
    nextBtn.disabled = cur === total - 1;
    document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === cur));
    render(cur);
    // Preload next 3
    for (let i = 1; i <= 3; i++) {
      const idx = cur + i;
      if (idx < total) render(idx);
    }
  }

  // Touch events
  let sx = 0, sy = 0, sw = false;
  swipeWrap.addEventListener('touchstart', e => {
    sx = e.changedTouches[0].screenX;
    sy = e.changedTouches[0].screenY;
    sw = true;
  }, { passive: true });
  swipeWrap.addEventListener('touchmove', e => {
    if (!sw) return;
    const dx = e.changedTouches[0].screenX - sx;
    const dy = e.changedTouches[0].screenY - sy;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 20) e.preventDefault();
  }, { passive: false });
  swipeWrap.addEventListener('touchend', e => {
    if (!sw) return;
    const dx = e.changedTouches[0].screenX - sx;
    if (Math.abs(dx) > 40) {
      if (dx < 0 && cur < total - 1) { cur++; update(); }
      else if (dx > 0 && cur > 0) { cur--; update(); }
    }
    sw = false;
  }, { passive: true });

  prevBtn.addEventListener('click', () => { if (cur > 0) { cur--; update(); } });
  nextBtn.addEventListener('click', () => { if (cur < total - 1) { cur++; update(); } });
  dotsEl.addEventListener('click', e => {
    const d = e.target.closest('.dot');
    if (d) { cur = parseInt(d.dataset.i); update(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' && cur > 0) { cur--; update(); }
    if (e.key === 'ArrowRight' && cur < total - 1) { cur++; update(); }
  });

  update();
})();

  // Email copy button
  document.getElementById('emailBtn').addEventListener('click', function() {
    var d = all[cur];
    var email = generateEmail(d);
    navigator.clipboard.writeText(email.body).then(function() {
      showToast('\u2709 Email copied for ' + d.business);
    }).catch(function() {
      var mailto = 'mailto:?subject=' + encodeURIComponent(email.subject) + '&body=' + encodeURIComponent(email.body);
      window.open(mailto, '_blank');
    });
  });

  // Open site / search button
  document.getElementById('openBtn').addEventListener('click', function() {
    var d = all[cur];
    if (d.score > 0 && d.url && d.url.indexOf('http') === 0) {
      window.open(d.url, '_blank');
    } else {
      window.open('https://google.com/search?q=' + encodeURIComponent(d.business + ' ' + d.location), '_blank');
    }
  });

  // Toast notification
  var toastEl = document.createElement('div');
  toastEl.id = 'toast';
  toastEl.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1f2937;color:#e6edf3;padding:8px 18px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid #30363d;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none;white-space:nowrap';
  document.body.appendChild(toastEl);
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.style.opacity = '1';
    setTimeout(function() { toastEl.style.opacity = '0'; }, 2000);
  }

</script>
</body>
</html>
