<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>DS Studios — Hunter Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#0d1117;color:#e6edf3;overflow:hidden;height:100dvh;width:100vw;touch-action:none;-webkit-user-select:none;user-select:none}
.top-bar{background:linear-gradient(135deg,#1f2937,#374151);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;height:44px;flex-shrink:0;border-bottom:1px solid #2d3748}
.top-bar .logo{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;background:rgba(255,255,255,.08);padding:3px 10px;border-radius:8px;color:#a3d977}
.top-bar .ctr{font-size:13px;font-weight:700;color:#e6edf3}
.swipe-wrap{position:relative;height:calc(100dvh - 44px);overflow:hidden}
.track{display:flex;height:100%;transition:transform .3s cubic-bezier(.25,.46,.45,.94);will-change:transform}
.card{min-width:100%;height:100%;display:flex;flex-direction:column;background:#161b22;overflow:hidden}
.card-scroll{flex:1;overflow-y:auto;padding:16px 16px 8px;-webkit-overflow-scrolling:touch;-ms-overflow-style:-ms-autohiding-scrollbar}
.loc-badge{display:inline-block;background:#1f2937;padding:2px 12px;border-radius:8px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;color:#a3d977;border:1px solid #2d3748}
.biz-name{font-size:22px;font-weight:800;line-height:1.2;margin-bottom:2px;color:#f0f6fc}
.biz-url{font-size:11px;color:#8b949e;margin-bottom:2px}
.biz-url a{color:#8b949e;text-decoration:underline;text-decoration-color:#30363d;text-underline-offset:3px}
.biz-url a:hover{color:#a3d977;text-decoration-color:#a3d977}
.biz-type{font-size:10px;color:#6e7681;text-transform:capitalize}
.no-web-badge{display:inline-block;background:#252d3a;padding:2px 10px;border-radius:6px;font-size:10px;font-weight:700;color:#f85149;border:1px solid #f8514933;margin-top:4px}
.score-row{display:flex;align-items:center;gap:16px;margin:10px 0 8px;padding:10px 14px;background:#0d1117;border-radius:12px;border:1px solid #21262d}
.score-ring{position:relative;width:60px;height:60px;flex-shrink:0}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.score-ring .lbl{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font-size:7px;text-transform:uppercase;letter-spacing:.5px;color:#6e7681;font-weight:600}
.sev-grid{flex:1;display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.sev-item{text-align:center;padding:6px 8px;border-radius:8px;font-size:10px;font-weight:600}
.sev-item .n{font-size:14px;font-weight:800;display:block;line-height:1.2}
.sev-item .l{font-size:7px;text-transform:uppercase;letter-spacing:.5px;opacity:.7}
.sev-tech{background:#1a1a2e;color:#7c8cf0;border:1px solid #7c8cf033}
.sev-visual{background:#1a2e1a;color:#7cf07c;border:1px solid #7cf07c33}
.sev-biz{background:#2e1a1a;color:#f07c7c;border:1px solid #f07c7c33}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#6e7681;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.issue-card{background:#0d1117;border:1px solid #21262d;border-radius:10px;padding:10px 12px;margin-bottom:6px}
.issue-card .card-label{font-size:11px;font-weight:700;color:#f0f6fc;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.issue-card .card-label .tag{font-size:8px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;padding:1px 6px;border-radius:4px}
.tag-tech{background:#7c8cf033;color:#7c8cf0}
.tag-visual{background:#7cf07c33;color:#7cf07c}
.tag-biz{background:#f07c7c33;color:#f07c7c}
.issue-card ul{margin:0;padding-left:14px;font-size:11px;color:#8b949e;line-height:1.6}
.issue-card ul li{margin-bottom:2px}
.issue-card ul li:last-child{margin-bottom:0}
.design-note{background:#1a1a2e;border:1px solid #7c8cf033;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:11px;color:#c9d1d9;line-height:1.5}
.design-note strong{color:#7c8cf0;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.notes-box{background:#1a2e1a;border:1px solid #7cf07c33;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:11px;color:#c9d1d9;line-height:1.5;border-left:3px solid #7cf07c}
.nav-bar{display:flex;align-items:center;justify-content:center;gap:12px;padding:6px 16px 10px;background:#0d1117;flex-shrink:0;border-top:1px solid #21262d}
.nav-btn{background:#1f2937;border:1px solid #30363d;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:all .15s;color:#e6edf3}
.nav-btn:active{transform:scale(.92)}
.nav-btn:disabled{opacity:.2;pointer-events:none}
.dots{display:flex;gap:3px;flex-wrap:wrap;max-width:200px;justify-content:center}
.dot{width:5px;height:5px;border-radius:50%;background:#30363d;transition:all .2s}
.dot.active{background:#a3d977;width:16px;border-radius:3px}
.loading-card{display:flex;align-items:center;justify-content:center;min-width:100%;height:100%;font-size:13px;color:#6e7681;flex-direction:column;gap:6px}
.loading-card::after{content:'';width:20px;height:20px;border:2px solid #21262d;border-top-color:#a3d977;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:600px){
.biz-name{font-size:24px}
.card-scroll{padding:24px 24px 12px;max-width:640px;margin:0 auto}
}
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo">🐾 Hunter Report</div>
  <div class="ctr" id="ctr">—</div>
</div>

<div class="swipe-wrap" id="swipeWrap">
  <div class="track" id="track"></div>
  <div class="nav-bar" id="navBar">
    <button class="nav-btn" id="prevBtn">←</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn" id="nextBtn">→</button>
  </div>
</div>

<script>
const HUNTER_DATA = [

  {

    "tech": ["Domain downhillinnhotel.com is dead", "Site content quite thin on extracted text", "Appears to be an older site template"],
    "visual": ["No gallery or visual content extracted from homepage"],
    "business": ["No special offers or pricing clearly on homepage", "Booking goes to external subdomain"],
    "notes": "Functional 3-star hotel site with online booking. Could improve with richer content, photo galleries, and more prominent contact details."
  },
  {
    "business": "Dalton Inn Hotel",
    "type": "Hotel / Bar / Restaurant",
    "url": "http://www.daltoninn.com",
    "location": "Claremorris",
    "score": 35,
    "design": "Very old website — content could not be extracted (likely uses Flash, frames, or very outdated HTML).",
    "tech": ["HTTP (no SSL on main domain)", "Content unreadable by modern extraction tools", "Likely outdated technology (Flash/frames)"],

  },

    "notes": "Best-designed site in this audit. Has online reservations, clear hours, social presence. Minor improvements: display menu directly on site."
  },
  {
    "business": "Flanagan's Pub",
    "type": "Pub",
    "url": null,
    "location": "Claremorris",
    "score": 0,

    "tech": ["Domain flanaganspub.ie does not resolve (ENOTFOUND)", "No website at all"],
    "visual": ["N/A"],
    "business": ["Highly rated pub (5.0 on Yelp) with zero digital presence", "Phone: (094) 938 0101", "Located in Brickens, Claremorris area"],
    "notes": "Perfect candidate for a simple website build. 5.0 rating on Yelp — strong reputation, zero website."
  },
  {
    "business": "McCallig Bros",
    "type": "Hardware / DIY Wholesalers",
    "url": null,
    "location": "Claremorris",
    "score": 0,
    "design": "No website — directory listings only (Yelp, GoldenPages).",
    "tech": ["No website exists — only third-party directory pages"],
    "visual": ["N/A"],
    "business": ["Phone: (094) 937 1079", "Address: Mount Street, Claremorris", "No email or website found"],
    "notes": "Long-established hardware/D.I.Y. store in Claremorris. No digital presence at all — ideal for a simple business website."
  },
  {
    "business": "The Square Cafe",
    "type": "Cafe",
    "url": null,
    "location": "Claremorris",
    "score": 0,
    "design": "No website — Facebook page only.",
    "tech": ["No standalone website"],
    "visual": ["N/A"],
    "business": ["Facebook-only presence", "TripAdvisor listed", "Located in Claremorris town centre", "Serves breakfast & lunch, closed Tuesdays"],
    "notes": "Popular cafe with good TripAdvisor reviews but no website. Ideal for a simple landing page with menu and opening hours."
  }
];

const scoreColor = s => s >= 75 ? '#7cf07c' : s >= 55 ? '#f0c040' : s >= 1 ? '#f07c7c' : '#6e7681';

function buildHunterCard(data) {
  let h = `<div class="card-scroll">
    <div class="loc-badge">${data.location.toUpperCase()}</div>
    <div class="biz-name">${data.business}</div>`;

  if (data.url) {
    const displayUrl = data.url.replace(/^https?:\/\//, '');
    h += `<div class="biz-url"><a href="${data.url}" target="_blank" rel="noopener">${displayUrl}</a></div>`;
  } else {
    h += `<div class="no-web-badge">◈ No Website</div>`;
  }

  h += `<div class="biz-type">${data.type}</div>`;

  if (data.score > 0) {
    const c = scoreColor(data.score);
    const r = 38, circ = 2 * Math.PI * r;
    const off = circ * (1 - data.score / 100);
    h += `<div class="score-row">
      <div class="score-ring">
        <svg width="60" height="60" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="${r}" fill="none" stroke="#21262d" stroke-width="6"/>
          <circle cx="50" cy="50" r="${r}" fill="none" stroke="${c}" stroke-width="6"
            stroke-dasharray="${circ}" stroke-dashoffset="${off}" stroke-linecap="round"/>
        </svg>
        <div class="val" style="color:${c}">${data.score}</div>
        <div class="lbl">Score</div>
      </div>
      <div class="sev-grid">
        <div class="sev-item sev-tech"><span class="n">${data.tech.length}</span><span class="l">Tech Issues</span></div>
        <div class="sev-item sev-visual"><span class="n">${data.visual.length}</span><span class="l">Visual Issues</span></div>
      </div>
    </div>`;
  } else {
    h += `<div class="score-row">
      <div style="flex:1;text-align:center;padding:8px 0">
        <div style="font-size:28px;font-weight:800;color:#6e7681">—</div>
        <div style="font-size:10px;color:#6e7681;text-transform:uppercase;letter-spacing:.5px">No website to score</div>
      </div>
    </div>`;
  }

  // Design quality
  h += `<div class="section-title">Design Quality</div>
    <div class="design-note"><strong>Review</strong><br>${data.design}</div>`;

  // Tech issues
  h += `<div class="section-title">Technical Issues (${data.tech.length})</div>`;
  if (data.tech.length && data.tech[0] !== 'N/A') {
    h += `<div class="issue-card"><div class="card-label"><span class="tag tag-tech">● Tech</span> Issues</div><ul>`;
    data.tech.forEach(t => { h += `<li>${t}</li>`; });
    h += `</ul></div>`;
  } else {
    h += `<div class="issue-card" style="color:#6e7681;font-size:11px;text-align:center;padding:14px">N/A — no website</div>`;
  }

  // Visual issues
  h += `<div class="section-title">Visual Issues (${data.visual.length})</div>`;
  if (data.visual.length && data.visual[0] !== 'N/A') {
    h += `<div class="issue-card"><div class="card-label"><span class="tag tag-visual">● Visual</span> Issues</div><ul>`;
    data.visual.forEach(v => { h += `<li>${v}</li>`; });
    h += `</ul></div>`;
  } else {
    h += `<div class="issue-card" style="color:#6e7681;font-size:11px;text-align:center;padding:14px">N/A — no website</div>`;
  }

  // Business issues
  h += `<div class="section-title">Business Issues (${data.business.length})</div>`;
  h += `<div class="issue-card"><div class="card-label"><span class="tag tag-biz">● Business</span> Gaps</div><ul>`;
  data.business.forEach(b => { h += `<li>${b}</li>`; });
  h += `</ul></div>`;

  // Notes
  h += `<div class="notes-box"><strong>🐾 Hunter's Note</strong><br>${data.notes}</div>`;

  h += `<div style="height:4px"></div></div>`;
  return h;
}

// ===== INIT =====
(function(){
  const all = HUNTER_DATA;
  const total = all.length;
  const track = document.getElementById('track'),
        dotsEl = document.getElementById('dots'),
        ctr = document.getElementById('ctr'),
        prevBtn = document.getElementById('prevBtn'),
        nextBtn = document.getElementById('nextBtn'),
        swipeWrap = document.getElementById('swipeWrap');

  // Create card slots
  all.forEach(() => {
    const div = document.createElement('div');
    div.className = 'card loading-card';
    div.innerHTML = '<span>Loading…</span>';
    track.appendChild(div);
  });
  dotsEl.innerHTML = all.map((_, i) => `<div class="dot${i===0?' active':''}" data-i="${i}"></div>`).join('');

  let cur = 0;

  function render(idx) {
    const el = track.querySelectorAll('.card')[idx];
    if (!el) return;
    el.className = 'card';
    el.innerHTML = buildHunterCard(all[idx]);
  }

  function update() {
    track.style.transform = `translateX(-${cur * 100}%)`;
    ctr.textContent = `${cur + 1}/${total}`;
    prevBtn.disabled = cur === 0;
    nextBtn.disabled = cur === total - 1;
    document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === cur));
    render(cur);
    // Preload next 3
    for (let i = 1; i <= 3; i++) {
      const idx = cur + i;
      if (idx < total) render(idx);
    }
  }

  // Touch events
  let sx = 0, sy = 0, sw = false;
  swipeWrap.addEventListener('touchstart', e => {
    sx = e.changedTouches[0].screenX;
    sy = e.changedTouches[0].screenY;
    sw = true;
  }, { passive: true });
  swipeWrap.addEventListener('touchmove', e => {
    if (!sw) return;
    const dx = e.changedTouches[0].screenX - sx;
    const dy = e.changedTouches[0].screenY - sy;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 20) e.preventDefault();
  }, { passive: false });
  swipeWrap.addEventListener('touchend', e => {
    if (!sw) return;
    const dx = e.changedTouches[0].screenX - sx;
    if (Math.abs(dx) > 40) {
      if (dx < 0 && cur < total - 1) { cur++; update(); }
      else if (dx > 0 && cur > 0) { cur--; update(); }
    }
    sw = false;
  }, { passive: true });

  prevBtn.addEventListener('click', () => { if (cur > 0) { cur--; update(); } });
  nextBtn.addEventListener('click', () => { if (cur < total - 1) { cur++; update(); } });
  dotsEl.addEventListener('click', e => {
    const d = e.target.closest('.dot');
    if (d) { cur = parseInt(d.dataset.i); update(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' && cur > 0) { cur--; update(); }
    if (e.key === 'ArrowRight' && cur < total - 1) { cur++; update(); }
  });

  update();
})();
</script>
</body>
</html>
